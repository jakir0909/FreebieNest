<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreebieNest - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    
    <!-- Login Screen -->
    <div id="loginScreen" class="flex justify-center items-center h-screen">
        <div class="bg-white p-8 rounded-xl shadow-md w-96">
            <h2 class="text-2xl font-bold mb-4 text-indigo-600 text-center"><i class="fa-solid fa-lock"></i> Admin Login</h2>
            <p class="text-xs text-gray-500 mb-4 text-center">Default Password: <b>admin123</b></p>
            <input type="password" id="adminPassword" placeholder="Enter Password" class="w-full border px-4 py-2 rounded mb-4 focus:outline-none focus:border-indigo-600">
            <button onclick="loginAdmin()" class="w-full bg-indigo-600 text-white py-2 rounded font-semibold hover:bg-indigo-700 transition">Login</button>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard" class="hidden min-h-screen">
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600"><i class="fa-solid fa-gauge"></i> FreebieNest Admin Panel</h1>
            <button onclick="logoutAdmin()" class="text-red-500 font-semibold text-sm hover:underline"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </header>

        <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Add Item Form -->
            <div class="bg-white p-6 rounded-xl shadow-sm border md:col-span-1">
                <h2 class="font-bold text-lg mb-4 text-gray-700">Add New Freebie</h2>
                <form id="addForm" onsubmit="addItem(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Title</label>
                        <input type="text" id="itemTitle" required class="w-full border px-3 py-2 rounded text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Type</label>
                        <select id="itemType" class="w-full border px-3 py-2 rounded text-sm focus:outline-none">
                            <option value="prompt">AI Prompt</option>
                            <option value="photo">Photo</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Category</label>
                        <input type="text" id="itemCategory" placeholder="e.g. AI Prompts, Photos" required class="w-full border px-3 py-2 rounded text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Image URL</label>
                        <input type="url" id="itemImage" placeholder="https://..." required class="w-full border px-3 py-2 rounded text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Description</label>
                        <textarea id="itemDesc" rows="2" required class="w-full border px-3 py-2 rounded text-sm focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Prompt Text (if applicable)</label>
                        <textarea id="itemPromptText" rows="2" class="w-full border px-3 py-2 rounded text-sm focus:outline-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">Download URL</label>
                        <input type="text" id="itemDownloadUrl" placeholder="https://..." required class="w-full border px-3 py-2 rounded text-sm focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded font-semibold hover:bg-indigo-700 transition">Add Item</button>
                </form>
            </div>

            <!-- Manage Items List -->
            <div class="bg-white p-6 rounded-xl shadow-sm border md:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-lg text-gray-700">Manage Freebies</h2>
                    <button onclick="exportJSON()" class="bg-green-600 text-white text-xs px-3 py-2 rounded font-semibold hover:bg-green-700 transition"><i class="fa-solid fa-download"></i> Export freebies.json</button>
                </div>
                <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b bg-gray-50 text-xs text-gray-500">
                                <th class="p-3">Image</th>
                                <th class="p-3">Title</th>
                                <th class="p-3">Type</th>
                                <th class="p-3">Action</th>
                            </tr>
                        </thead>
                        <tbody id="adminItemList">
                            <!-- Populated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let freebies = JSON.parse(localStorage.getItem('fn_freebies')) || [
            {
                id: 1,
                title: "Cyberpunk City AI Prompt & Stock Photo",
                type: "prompt",
                category: "AI Prompts",
                image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=60",
                description: "A detailed Midjourney/ChatGPT prompt to generate futuristic cyberpunk cityscapes at night.",
                promptText: "A hyper-realistic cyberpunk city at night, neon lights reflecting on wet streets, cinematic lighting, 8k resolution, Unreal Engine 5 render --ar 16:9",
                downloadUrl: "#"
            },
            {
                id: 2,
                title: "Minimalist Landscape Photography",
                type: "photo",
                category: "Photos",
                image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&auto=format&fit=crop&q=60",
                description: "High-resolution tropical beach landscape photo, perfect for blogs and wallpapers.",
                promptText: "",
                downloadUrl: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?force=true"
            }
        ];

        function loginAdmin() {
            const pass = document.getElementById('adminPassword').value;
            if(pass === 'admin123') { // পাসওয়ার্ড এখানে পরিবর্তন করতে পারেন
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                renderAdminList();
            } else {
                alert('Wrong Password!');
            }
        }

        function logoutAdmin() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
        }

        function renderAdminList() {
            const list = document.getElementById('adminItemList');
            list.innerHTML = '';
            freebies.forEach(item => {
                list.innerHTML += `
                    <tr class="border-b text-sm">
                        <td class="p-3"><img src="${item.image}" class="w-12 h-12 object-cover rounded"></td>
                        <td class="p-3 font-semibold text-gray-800">${item.title}</td>
                        <td class="p-3"><span class="bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded text-xs">${item.type}</span></td>
                        <td class="p-3"><button onclick="deleteItem(${item.id})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });
            localStorage.setItem('fn_freebies', JSON.stringify(freebies));
        }

        function addItem(e) {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                title: document.getElementById('itemTitle').value,
                type: document.getElementById('itemType').value,
                category: document.getElementById('itemCategory').value,
                image: document.getElementById('itemImage').value,
                description: document.getElementById('itemDesc').value,
                promptText: document.getElementById('itemPromptText').value,
                downloadUrl: document.getElementById('itemDownloadUrl').value
            };
            freebies.unshift(newItem);
            renderAdminList();
            document.getElementById('addForm').reset();
            alert('Item added successfully! Click "Export freebies.json" and upload to GitHub.');
        }

        function deleteItem(id) {
            if(confirm('Are you sure you want to delete this item?')) {
                freebies = freebies.filter(i => i.id !== id);
                renderAdminList();
            }
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(freebies, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "freebies.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            alert('freebies.json downloaded! Upload this file to your GitHub repository to update the main site.');
        }
    </script>
</body>
</html>
