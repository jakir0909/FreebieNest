<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreebieNest - Free Photos & AI Prompts</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-black text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-box-archive"></i> FreebieNest
            </a>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-500 hidden sm:block">Free Photos & AI Prompt Templates</span>
                <a href="admin.html" target="_blank" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg font-medium transition"><i class="fa-solid fa-user-gear"></i> Admin</a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-12 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4">Discover & Download Freebies Instantly</h1>
            <p class="text-indigo-100 text-lg mb-6">কোনো সাইন-আপ ছাড়াই ডাউনলোড করুন প্রিমিয়াম ফটো এবং এআই প্রম্পট টেমপ্লেট।</p>
            <!-- Search -->
            <div class="flex justify-center">
                <input type="text" id="searchInput" placeholder="Search prompts or photos..." class="px-4 py-3 rounded-lg text-gray-800 w-full sm:w-96 focus:outline-none">
            </div>
        </div>
    </section>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-10">
        <div id="freebieGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Dynamic Items loaded via JS -->
        </div>
    </main>

    <!-- Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 text-center text-gray-500 text-sm">
        &copy; 2026 FreebieNest. All rights reserved. Built with GitHub & Cloudflare.
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        let freebies = [];

        // Fetch freebies.json dynamically
        async function loadFreebies() {
            try {
                const response = await fetch('freebies.json');
                freebies = await response.json();
                renderItems(freebies);
            } catch (error) {
                console.error('Error loading freebies:', error);
                document.getElementById('freebieGrid').innerHTML = '<p class="col-span-3 text-center text-gray-500">No items found or freebies.json missing. Please add items via admin panel.</p>';
            }
        }

        function getComments(id) {
            let allComments = JSON.parse(localStorage.getItem('fn_comments')) || {};
            return allComments[id] || [];
        }

        function saveComment(id, name, text) {
            let allComments = JSON.parse(localStorage.getItem('fn_comments')) || {};
            if(!allComments[id]) allComments[id] = [];
            allComments[id].push({ name, text });
            localStorage.setItem('fn_comments', JSON.stringify(allComments));
        }

        function renderItems(items) {
            const grid = document.getElementById('freebieGrid');
            grid.innerHTML = '';
            if(items.length === 0) {
                grid.innerHTML = '<p class="col-span-3 text-center text-gray-500">No freebies available right now.</p>';
                return;
            }
            items.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <img src="${item.image}" alt="${item.title}" class="w-full h-48 object-cover">
                            <div class="p-4">
                                <span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded font-medium">${item.category}</span>
                                <h3 class="font-bold text-lg mt-2 text-gray-800">${item.title}</h3>
                                <p class="text-gray-500 text-sm mt-1 line-clamp-2">${item.description}</p>
                            </div>
                        </div>
                        <div class="p-4 pt-0 flex justify-between items-center border-t border-gray-100 mt-4 pt-3">
                            <button onclick="openModal(${item.id})" class="text-indigo-600 font-semibold text-sm hover:underline">View & Download</button>
                            <button onclick="shareItem('${item.title}')" class="text-gray-400 hover:text-indigo-600"><i class="fa-solid fa-share-nodes"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(id) {
            const item = freebies.find(i => i.id === id);
            const comments = getComments(id);
            
            let modalHTML = `
                <img src="${item.image}" alt="${item.title}" class="w-full h-64 object-cover rounded-lg mb-4">
                <span class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded font-medium">${item.category}</span>
                <h2 class="text-2xl font-bold mt-2 text-gray-800">${item.title}</h2>
                <p class="text-gray-600 mt-2">${item.description}</p>
            `;

            if(item.promptText) {
                modalHTML += `
                    <div class="mt-4 bg-gray-50 p-3 rounded-lg border">
                        <label class="text-xs font-bold text-gray-500 block mb-1">PROMPT TEXT:</label>
                        <p id="promptTextVal" class="text-sm font-mono text-gray-700">${item.promptText}</p>
                        <button onclick="copyPrompt()" class="mt-2 bg-gray-800 text-white text-xs px-3 py-1.5 rounded hover:bg-black"><i class="fa-regular fa-copy"></i> Copy Prompt</button>
                    </div>
                `;
            }

            // Monetized Download Button
            modalHTML += `
                <div class="mt-6">
                    <button onclick="triggerDownload('${item.downloadUrl}')" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-download"></i> Download Freebie (Ad Supported)
                    </button>
                </div>
            `;

            // Comments Section
            modalHTML += `
                <div class="mt-8 border-t pt-4">
                    <h3 class="font-bold text-lg mb-3">Comments (No login required)</h3>
                    <div class="space-y-3 max-h-40 overflow-y-auto mb-4" id="commentList">
                        ${comments.length ? comments.map(c => `<div class="bg-gray-50 p-2.5 rounded text-sm"><strong>${c.name}:</strong>${c.text}</div>`).join('') : '<p class="text-xs text-gray-400">No comments yet. Be the first!</p>'}
                    </div>
                    <div class="flex flex-col gap-2">
                        <input type="text" id="commentName" placeholder="Your Name" class="border px-3 py-2 rounded text-sm focus:outline-none">
                        <textarea id="commentText" placeholder="Write a comment..." class="border px-3 py-2 rounded text-sm focus:outline-none" rows="2"></textarea>
                        <button onclick="submitComment(${item.id})" class="bg-gray-800 text-white py-2 rounded text-sm font-semibold hover:bg-black">Post Comment</button>
                    </div>
                </div>
            `;

            document.getElementById('modalContent').innerHTML = modalHTML;
            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('flex');
            document.getElementById('detailModal').classList.add('hidden');
        }

        function triggerDownload(url) {
            window.open('https://www.example-adnetwork-link.com', '_blank'); // আপনার অ্যাড লিঙ্ক এখানে বসাবেন
            if(url && url !== '#') {
                const a = document.createElement('a');
                a.href = url;
                a.download = '';
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function copyPrompt() {
            const text = document.getElementById('promptTextVal').innerText;
            navigator.clipboard.writeText(text);
            alert('Prompt copied to clipboard!');
        }

        function submitComment(id) {
            const name = document.getElementById('commentName').value.trim();
            const text = document.getElementById('commentText').value.trim();
            if(!name || !text) {
                alert('Please fill in both name and comment.');
                return;
            }
            saveComment(id, name, text);
            openModal(id);
        }

        function shareItem(title) {
            if (navigator.share) {
                navigator.share({ title: title, url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('Link copied to clipboard!');
            }
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const filtered = freebies.filter(item => item.title.toLowerCase().includes(keyword) || item.description.toLowerCase().includes(keyword));
            renderItems(filtered);
        });

        // Initialize load
        loadFreebies();
    </script>
</body>
</html>
