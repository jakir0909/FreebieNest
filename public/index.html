<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreebieNest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="google" content="notranslate" />
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-black text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-box-archive"></i> FreebieNest
            </a>
            <div class="flex items-center gap-3">
                <!-- 👇 পোস্ট বাটন যা সরাসরি অ্যাডমিন প্যানেলে নিয়ে যাবে 👇 -->
                <a href="/admin/" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:bg-indigo-700 transition">
                    <i class="fa-solid fa-plus"></i> Post
                </a>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white py-12 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4">Download Premium Freebies</h1>
            <p class="text-indigo-100 text-lg mb-6">AI Prompts & Planners without login.</p>
            <input type="text" id="searchInput" placeholder="Search..." class="px-4 py-3 rounded-lg text-gray-800 w-full sm:w-96 focus:outline-none shadow-md">
        </div>
    </section>

    <!-- Main Grid -->
    <main class="max-w-7xl mx-auto px-4 py-10">
        <div id="freebieGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="col-span-3 text-center py-10"><i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-500"></i></div>
        </div>
    </main>

    <!-- Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black/70 hidden justify-center items-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-xl max-w-2xl w-full my-8 relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 text-gray-600 w-8 h-8 rounded-full z-10"><i class="fa-solid fa-xmark"></i></button>
            <div id="modalContent" class="p-6"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://freebienest-api.linkt.workers.dev'; 
        let posts = [];

        async function fetchPosts() {
            try {
                const res = await fetch(`${API_URL}/api/posts`);
                posts = await res.json();
                renderGrid(posts);
            } catch(e) {
                document.getElementById('freebieGrid').innerHTML = '<p class="col-span-3 text-center text-red-500 py-10">Error loading data.</p>';
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('freebieGrid');
            grid.innerHTML = '';
            if(!items.length) {
                grid.innerHTML = '<p class="col-span-3 text-center text-gray-500 py-10">No posts found. Click "+ Post" to add one.</p>';
                return;
            }
            items.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <img src="${item.image}" class="w-full h-48 object-cover" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&q=80'">
                            <div class="p-4">
                                <h3 class="font-bold text-lg text-gray-800 line-clamp-1">${item.title}</h3>
                                <p class="text-gray-500 text-sm mt-1 line-clamp-2">${item.description}</p>
                            </div>
                        </div>
                        <div class="p-4 pt-3 border-t border-gray-100">
                            <button onclick="openModal(${item.id})" class="w-full bg-indigo-50 text-indigo-600 font-bold py-2 rounded-lg hover:bg-indigo-100">Download Now</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(id) {
            const item = posts.find(i => i.id === id);
            let modalHTML = `
                <img src="${item.image}" class="w-full h-56 object-cover rounded-lg mb-4">
                <h2 class="text-2xl font-bold text-gray-800">${item.title}</h2>
                <p class="text-gray-600 mt-2 mb-6">${item.description}</p>
                
                <div class="border-t pt-6 text-center">
                    <button onclick="startAdDownload('${item.adLink}', '${item.contentLink}')" class="w-full bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-600 transition flex justify-center items-center gap-2 shadow-lg text-lg">
                        <i class="fa-solid fa-download"></i> Download File
                    </button>
                    <p class="text-xs text-gray-400 mt-2">(Clicking will open a sponsor link first, then start download)</p>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = modalHTML;
            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function startAdDownload(adLink, contentLink) {
            // ১. নতুন ট্যাবে আপনার অ্যাড লিংক ওপেন হবে
            window.open(adLink, '_blank');

            // ২. পপআপে ৫ সেকেন্ড টাইমার দেখাবে
            let timerHtml = `
                <div class="text-center py-10">
                    <h3 class="text-xl font-bold mb-2">Generating Link...</h3>
                    <p class="text-gray-500 mb-6">Please wait while we prepare your file.</p>
                    <div class="bg-gray-100 p-6 rounded-lg mb-6 border border-dashed">
                        [ Ad Space ]
                    </div>
                    <button id="dlBtn" class="w-full bg-gray-300 text-gray-500 py-3 rounded-xl font-bold cursor-not-allowed" disabled>
                        Wait... <span id="countdown" class="font-bold">5</span>s
                    </button>
                </div>
            `;
            document.getElementById('modalContent').innerHTML = timerHtml;

            // ৩. টাইমার শেষ হলে ডাউনলোড বাটন অ্যাক্টিভ হবে
            let timeLeft = 5;
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('countdown').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    const btn = document.getElementById('dlBtn');
                    btn.disabled = false;
                    btn.className = "w-full bg-green-500 text-white py-3 rounded-xl font-bold hover:bg-green-600 transition shadow-lg text-lg";
                    btn.innerHTML = '<i class="fa-solid fa-download"></i> Click to Download';
                    btn.onclick = function() { 
                        window.open(contentLink, '_blank'); // আসল ডাউনলোড লিংক
                    };
                }
            }, 1000);
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('flex');
            document.getElementById('detailModal').classList.add('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = e.target.value.toLowerCase();
            const filtered = posts.filter(i => i.title.toLowerCase().includes(keyword));
            renderGrid(filtered);
        });

        fetchPosts();
    </script>
</body>
</html>
