<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="google" content="notranslate" />
  <title>Admin Panel | FreebieNest</title>
  <style>
    body, button, input, select, textarea {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif !important;
    }
    [class*="AppHeader"] { background-color: #4F46E5 !important; }
    [class*="Sidebar"] { background-color: #ffffff !important; border-right: 1px solid #e5e7eb !important; }
    [class*="Toolbar"] a, [class*="Toolbar"] button { background-color: #4F46E5 !important; color: white !important; border: none !important; }
    input, textarea, select { border-radius: 8px !important; border: 1px solid #d1d5db !important; padding: 10px !important; }
    
    .app-home-btn {
      position: fixed; bottom: 20px; right: 20px;
      background-color: #4F46E5; color: white !important;
      padding: 12px 20px; border-radius: 50px;
      font-weight: bold; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.5);
      z-index: 99999; text-decoration: none;
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; transition: transform 0.2s;
    }
    .app-home-btn:hover { transform: scale(1.05); background-color: #4338CA; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  
  <a href="https://freebienest.pages.dev" class="app-home-btn">
    <span style="font-size: 18px;">🏠</span> Go to App
  </a>
</body>
</html>
