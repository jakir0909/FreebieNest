backend:
  name: git-gateway
  repo: jakir0909/FreebieNest
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/557aa935-eccc-4cad-b3ec-d90dd984bfb4/pkce
  auth_token_endpoint: /sites/557aa935-eccc-4cad-b3ec-d90dd984bfb4/token
  gateway_url: https://gateway.decapbridge.com

media_folder: "public/uploads"
public_folder: "/uploads"
site_url: https://freebienest.pages.dev

collections:
  - name: "posts"
    label: "📝 My Posts"
    label_singular: "Post"
    folder: "src/content/planners"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Post Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image Link (URL)", name: "thumbnail", widget: "string", hint: "ছবির সরাসরি লিংক দিন" }
      - { label: "Ad Link (URL)", name: "adLink", widget: "string", hint: "এখানে আপনার Adsterra বা Monetag এর লিংক দিন" }
      - { label: "Content/Download Link (URL)", name: "contentLink", widget: "string", hint: "অ্যাড দেখার পর যে ফাইল ডাউনলোড হবে তার লিংক" }
