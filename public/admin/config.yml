backend:
  name: git-gateway
  repo: jakir0909/FreebieNest
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/557aa935-eccc-4cad-b3ec-d90dd984bfb4/pkce
  auth_token_endpoint: /sites/557aa935-eccc-4cad-b3ec-d90dd984bfb4/token
  gateway_url: https://gateway.decapbridge.com

media_folder: "public/uploads"
public_folder: "/uploads"
site_url: https://freebienest.pages.dev

collections:
  - name: "posts"
    label: "📝 My Posts"
    label_singular: "Post"
    folder: "src/content/planners"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Post Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Category", name: "category", widget: "select", options: ["Digital Planner", "AI Prompt", "Photo", "Other"] }
      - { label: "Cover Image", name: "thumbnail", widget: "image", required: false, hint: "ছবি আপলোড করুন" }
      - label: "Ad Links (Multiple)"
        name: "adLinks"
        widget: "list"
        required: false
        hint: "এখানে '+' বাটনে ক্লিক করে একাধিক অ্যাড লিংক দিন। ডাউনলোডের সময় এগুলো একটার পর একটা ওপেন হবে।"
      - { label: "Content/Download Link", name: "contentLink", widget: "string", hint: "সব অ্যাড দেখার পর যে ফাইলটি ডাউনলোড হবে তার লিংক" }
